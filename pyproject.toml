[project]
name = "molsim"
version = "0.1.0"
description = "Break-even simulator for molecular compute-in-memory LLM inference (arXiv preprint)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "pint>=0.24",
]

[project.optional-dependencies]
# Only for measuring this PC: `uv sync --extra bench`.
bench = ["torch>=2.7"]

[dependency-groups]
dev = [
    "markdown>=3.11.2",
    "pytest>=8.0",
]

# CUDA 12.8 builds of PyTorch support RTX 50-series (Blackwell) GPUs.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "bench" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["molsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
